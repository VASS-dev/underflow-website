<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="explore.meta_title">Explore Artist Connections — Underflow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <meta name="description" content="Type any artist and see a map of their remixers, collaborators and featured artists across Bandcamp, Beatport, Juno and more. Free to try.">
  <link rel="canonical" href="https://underflow.music/explore.html">
  <meta property="og:title" content="Explore Artist Connections — Underflow">
  <meta property="og:description" content="Type any artist and see a map of their remixers, collaborators and featured artists across Bandcamp, Beatport, Juno and more. Free to try.">
  <meta property="og:image" content="https://underflow.music/og-image.png">
  <meta property="og:url" content="https://underflow.music/explore.html">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="explore.css">
</head>
<body>
  <!-- Header -->
  <nav class="nav">
    <a href="index.html" class="logo"><img src="logo-white.png" alt="Underflow" class="logo-icon">Underflow</a>
    <div class="nav-right">
      <a href="index.html" class="nav-link" data-i18n="explore.nav_home">Home</a>
      <div class="lang-switch">
        <button type="button" class="lang-btn active" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="ru">RU</button>
      </div>
      <a href="index.html#download" class="nav-cta" data-i18n="nav.download">Download</a>
    </div>
  </nav>

  <!-- Search -->
  <div id="search-container" class="search-container">
    <h1 class="search-title" data-i18n="explore.title">Explore Artist Connections</h1>
    <p class="search-sub" data-i18n="explore.subtitle">See how artists are connected through remixes, collaborations, and features.</p>
    <form id="search-form" class="search-form">
      <input type="text" id="artist-input" class="search-input" placeholder="Enter artist name..." data-i18n="explore.input_placeholder" autocomplete="off" spellcheck="false">
      <button type="submit" class="search-btn" data-i18n="explore.submit">Explore</button>
    </form>
    <div class="search-hints">
      <span data-i18n="explore.hints_label">Try:</span> <button class="hint-btn" data-artist="Sepp">Sepp</button>
      <button class="hint-btn" data-artist="Arapu">Arapu</button>
      <button class="hint-btn" data-artist="Priku">Priku</button>
    </div>
  </div>

  <!-- Graph -->
  <div id="graph-container" class="graph-container hidden">
    <svg id="graph-svg"></svg>

    <!-- Tooltip -->
    <div id="tooltip" class="tooltip hidden">
      <div class="tooltip-name"></div>
      <div class="tooltip-details"></div>
    </div>

    <!-- Legend -->
    <div class="legend">
      <div class="legend-item"><span class="legend-dot" style="background:#a855f7"></span><span data-i18n="explore.rel_remixer">Remixer</span></div>
      <div class="legend-item"><span class="legend-dot" style="background:#3b82f6"></span><span data-i18n="explore.rel_collaborator">Collaborator</span></div>
      <div class="legend-item"><span class="legend-dot" style="background:#22c55e"></span><span data-i18n="explore.rel_featuring">Featured</span></div>
    </div>

    <!-- Back button -->
    <button id="back-btn" class="back-btn hidden" data-i18n="explore.back">← Back</button>

    <!-- Graph search bar (top center) -->
    <form id="graph-search-form" class="graph-search">
      <input type="text" id="graph-search-input" class="graph-search-input" placeholder="Search artist..." data-i18n="explore.graph_search_placeholder" autocomplete="off" spellcheck="false">
    </form>
  </div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="explore.js"></script>
</body>
</html>
